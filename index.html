<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vườn Tri Thức Lớp 2 - Môn Toán</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #3B82F6;
      --secondary: #1D4ED8;
      --accent: #F59E0B;
      --dark: #1E293B;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #E0F2FE 50%, #EDE9FE 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1100px;
      min-height: 760px;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(59, 130, 246, 0.2);
      border: 6px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }
    .seq-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #FFF;
      border: 3px solid #3B82F6;
      color: #1D4ED8;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #2563EB;
    }
    .seq-box.target {
      background: #FEF3C7;
      border-color: #F59E0B;
      color: #D97706;
      box-shadow: 0 4px 0 #D97706;
      animation: pulse-target 1.4s infinite;
    }
    @keyframes pulse-target {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-blue-600/95 via-indigo-600/95 to-purple-700/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-6xl shadow-2xl mb-4 transform -rotate-6 animate-bounce">
        🔢
      </div>
      <h1 class="text-3xl md:text-4xl font-black font-cute mb-3">🔢 TOÁN HỌC LỚP 2 VUI NHỘN 🔢</h1>
      <p class="text-base md:text-lg font-bold max-w-lg mb-6 leading-relaxed text-blue-100">
        Bé sẵn sàng chinh phục các con số, bảng tính và hình học cùng Thỏ Trắng chưa nào? ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-900 text-2xl md:text-3xl font-black px-10 py-4 md:py-5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-3">
        <span>🔊 BẮT ĐẦU HỌC NGAY</span>
      </button>
    </div>

    <!-- HEADER -->
    <header class="bg-white/95 backdrop-blur-md px-5 py-3 flex justify-between items-center border-b-2 border-blue-100 z-10">
      <div class="flex items-center space-x-2">
        <button id="btn-back-menu" onclick="openMathMenu()" class="btn-bounce bg-blue-50 hover:bg-blue-100 text-blue-700 border-2 border-blue-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm flex items-center space-x-1 shadow-sm hidden">
          <span>⬅️ Menu Chính</span>
        </button>
      </div>

      <div class="flex items-center justify-center">
        <h1 class="text-lg sm:text-xl md:text-2xl font-black font-cute text-blue-600 tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer" onclick="openMathMenu()">
          <span>🔢</span>
          <span class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">TOÁN HỌC LỚP 2</span>
          <span>🔢</span>
        </h1>
      </div>

      <div class="flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-3 py-1 rounded-2xl shadow-inner">
          <span class="text-xl animate-spin" style="animation-duration: 4s;">⭐</span>
          <span id="stars-count" class="text-xl font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden sm:inline">Sao</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-blue-100 hover:bg-blue-200 text-blue-700 border border-blue-300 px-2.5 py-1.5 rounded-2xl text-xs font-black flex items-center space-x-1 shadow-sm">
          <span>🐰 Cổ vũ</span>
        </button>
      </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main id="main-content" class="flex-1 p-4 md:p-6 flex flex-col items-center justify-center text-center overflow-y-auto">
      <!-- Dynamic Rendering -->
    </main>

  </div>

  <script>
    let stars = parseInt(localStorage.getItem('stars_math_lop2') || '0');
    let currentMode = null;
    let currentAnswer = null;
    let audioCtx = null;
    const onlineAudioPlayer = new Audio();

    document.getElementById('stars-count').innerText = stars;

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      speakClear("Chào bé yêu! Chúc con học môn Toán thật giỏi và rinh thật nhiều ngôi sao nhé!", "vi");
      document.getElementById('start-overlay').style.display = 'none';
      openMathMenu();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'vi', onEndCallback = null) {
      try {
        onlineAudioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        let cleanText = String(text || '')
          .replace(/\+/g, ' cộng ')
          .replace(/-/g, ' trừ ')
          .replace(/×/g, ' nhân ')
          .replace(/:/g, ' chia ')
          .replace(/=/g, ' bằng ');
        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.92;
        onlineAudioPlayer.onended = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };
        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackWebSpeech(cleanText, onEndCallback);
          });
        }
      } catch (err) {
        fallbackWebSpeech(text, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.1;
      utterance.lang = 'vi-VN';
      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      const cheers = [
        "Bé tính toán giỏi quá! Cứ phát huy nhé!",
        "Cố lên con, mỗi câu trả lời đúng là một ngôi sao sáng lấp lánh!",
        "Thỏ trắng chúc bé học Toán thật vui và đạt điểm 10 tuyệt đối!"
      ];
      speakClear(cheers[Math.floor(Math.random() * cheers.length)], "vi");
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_math_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({ particleCount: 60, spread: 80, origin: { y: 0.75 } });
    }

    const QUEUE_SYSTEM = {};
    function getNextItemFromPool(poolKey, rawDataArray) {
      if (!QUEUE_SYSTEM[poolKey] || QUEUE_SYSTEM[poolKey].length === 0) {
        const shuffled = [...rawDataArray];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        QUEUE_SYSTEM[poolKey] = shuffled;
      }
      return QUEUE_SYSTEM[poolKey].pop();
    }

    const container = document.getElementById('main-content');
    const btnBackMenu = document.getElementById('btn-back-menu');

    function openMathMenu() {
      currentMode = null;
      btnBackMenu.classList.add('hidden');
      container.innerHTML = `
        <div class="mb-4">
          <h2 class="text-2xl md:text-3xl font-black text-blue-600 font-cute">🔢 MÔN TOÁN LỚP 2 - CHƯƠNG TRÌNH ĐỘC LẬP</h2>
          <p class="text-xs md:text-sm font-bold text-gray-500">Bé chọn chuyên mục bên dưới để luyện tập nhé!</p>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5 w-full max-w-5xl">
          <div onclick="startMathLogicGame()" class="card-hover bg-white border-2 border-purple-200 hover:border-purple-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">🧩</div>
            <h3 class="text-xs md:text-sm font-black text-purple-700">1. Dãy Số Quy Luật</h3>
          </div>
          <div onclick="startMathAddSubGame()" class="card-hover bg-white border-2 border-blue-200 hover:border-blue-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">➕</div>
            <h3 class="text-xs md:text-sm font-black text-blue-700">2. Phép Tính Có Nhớ</h3>
          </div>
          <div onclick="startMathMultGame()" class="card-hover bg-white border-2 border-amber-200 hover:border-amber-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">✖️</div>
            <h3 class="text-xs md:text-sm font-black text-amber-700">3. Bảng Nhân 2 & 5</h3>
          </div>
          <div onclick="startMathDivGame()" class="card-hover bg-white border-2 border-teal-200 hover:border-teal-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">➗</div>
            <h3 class="text-xs md:text-sm font-black text-teal-700">4. Bảng Chia 2 & 5</h3>
          </div>
          <div onclick="startMathGeometryGame()" class="card-hover bg-white border-2 border-rose-200 hover:border-rose-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📐</div>
            <h3 class="text-xs md:text-sm font-black text-rose-700">5. Hình Học Cơ Bản</h3>
          </div>
          <div onclick="startMathLengthGame()" class="card-hover bg-white border-2 border-cyan-200 hover:border-cyan-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📏</div>
            <h3 class="text-xs md:text-sm font-black text-cyan-700">6. Đo Độ Dài (dm, cm, m)</h3>
          </div>
          <div onclick="startMathMassLitGame()" class="card-hover bg-white border-2 border-emerald-200 hover:border-emerald-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">⚖️</div>
            <h3 class="text-xs md:text-sm font-black text-emerald-700">7. Đơn Vị Lít & Ki-lô-gam</h3>
          </div>
          <div onclick="startMathClockGame()" class="card-hover bg-white border-2 border-orange-200 hover:border-orange-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">⏰</div>
            <h3 class="text-xs md:text-sm font-black text-orange-700">8. Xem Giờ & Lịch</h3>
          </div>
          <div onclick="startMathWordGame()" class="card-hover bg-white border-2 border-indigo-200 hover:border-indigo-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📖</div>
            <h3 class="text-xs md:text-sm font-black text-indigo-700">9. Bài Toán Có Lời Văn</h3>
          </div>
          <div onclick="startMathFindXGame()" class="card-hover bg-white border-2 border-pink-200 hover:border-pink-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">🔍</div>
            <h3 class="text-xs md:text-sm font-black text-pink-700">10. Tìm Thành Phần Chưa Biết</h3>
          </div>
        </div>
      `;
    }

    const MATH_LOGIC_BANK = [
      { sequence: [2, 4, 6, "?", 10], rule: "Đếm thêm 2 đơn vị (+2)", answer: 8, choices: [7, 8, 9, 12] },
      { sequence: [5, 10, 15, "?", 25], rule: "Đếm nhảy 5 đơn vị (+5)", answer: 20, choices: [18, 20, 22, 30] },
      { sequence: [10, 20, 30, 40, "?"], rule: "Dãy số tròn chục (+10)", answer: 50, choices: [45, 50, 60, 55] },
      { sequence: [1, 3, 5, 7, "?"], rule: "Dãy số lẻ (+2)", answer: 9, choices: [8, 9, 10, 11] }
    ];

    function startMathLogicGame() {
      currentMode = 'mathLogic';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathLogic', MATH_LOGIC_BANK);
      currentAnswer = q.answer;
      const seqHtml = q.sequence.map(item => item === "?" ? `<div class="seq-box target">?</div>` : `<div class="seq-box">${item}</div>`).join('');

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Điền số thích hợp vào dấu ?</span>
          <button class="btn-bounce bg-blue-100 hover:bg-blue-200 text-blue-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.sequence.join(', ').replace('?', 'chấm hỏi')}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="flex flex-wrap gap-2 justify-center mb-3">${seqHtml}</div>
          <div class="text-sm font-extrabold text-purple-600">Quy luật: ${q.rule}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-blue-400 hover:bg-blue-50 text-blue-700 font-black text-2xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, ${c})">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_ADD_SUB = [
      { a: 38, b: 25, op: '+', res: 63 }, { a: 52, b: 17, op: '-', res: 35 },
      { a: 47, b: 36, op: '+', res: 83 }, { a: 70, b: 24, op: '-', res: 46 }
    ];

    function startMathAddSubGame() {
      currentMode = 'mathAddSub';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathAddSub', MATH_ADD_SUB);
      currentAnswer = q.res;
      let choices = [q.res];
      while (choices.length < 4) {
        let fake = q.res + (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        if (!choices.includes(fake) && fake > 0) choices.push(fake);
      }
      choices.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Tính kết quả phép tính</span>
          <button class="btn-bounce bg-blue-100 hover:bg-blue-200 text-blue-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.a} ${q.op === '+' ? 'cộng' : 'trừ'} ${q.b} bằng bao nhiêu?', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-blue-50/50 border-2 border-dashed border-blue-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-4xl md:text-5xl font-black text-blue-600 font-cute tracking-wider">${q.a} ${q.op} ${q.b} = ?</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${choices.map(c => `<button class="btn-bounce bg-white border-4 border-blue-400 hover:bg-blue-50 text-blue-700 font-black text-2xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, ${c})">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_MULT = [
      { num1: 2, num2: 6, res: 12, visual: "2 × 6 = ?" }, { num1: 5, num2: 4, res: 20, visual: "5 × 4 = ?" }
    ];

    function startMathMultGame() {
      currentMode = 'mathMult';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathMult', MATH_MULT);
      currentAnswer = q.res;
      let choices = [q.res];
      while (choices.length < 4) {
        let fake = q.num1 * (Math.floor(Math.random() * 9) + 1);
        if (!choices.includes(fake)) choices.push(fake);
      }
      choices.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Bảng nhân ${q.num1}</span>
          <button class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.num1} nhân ${q.num2} bằng bao nhiêu?', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-amber-50/50 border-2 border-dashed border-amber-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-4xl md:text-5xl font-black text-amber-600 font-cute tracking-wider">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${choices.map(c => `<button class="btn-bounce bg-white border-4 border-amber-400 hover:bg-amber-50 text-amber-800 font-black text-2xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, ${c})">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_DIV = [
      { num1: 16, num2: 2, res: 8, visual: "16 : 2 = ?" }, { num1: 35, num2: 5, res: 7, visual: "35 : 5 = ?" }
    ];

    function startMathDivGame() {
      currentMode = 'mathDiv';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathDiv', MATH_DIV);
      currentAnswer = q.res;
      let choices = [q.res];
      while (choices.length < 4) {
        let fake = Math.floor(Math.random() * 9) + 1;
        if (!choices.includes(fake)) choices.push(fake);
      }
      choices.sort(() => Math.random() - 0.5);

      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>Bảng chia ${q.num2}</span>
          <button class="btn-bounce bg-teal-100 hover:bg-teal-200 text-teal-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.num1} chia ${q.num2} bằng bao nhiêu?', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-teal-50/50 border-2 border-dashed border-teal-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-4xl md:text-5xl font-black text-teal-600 font-cute tracking-wider">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${choices.map(c => `<button class="btn-bounce bg-white border-4 border-teal-400 hover:bg-teal-50 text-teal-800 font-black text-2xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, ${c})">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_GEOMETRY = [
      { visual: "📐", question: "Hình tam giác có bao nhiêu cạnh và đỉnh?", choices: ["3 cạnh và 3 đỉnh", "4 cạnh và 4 đỉnh", "2 cạnh", "5 cạnh"], answer: "3 cạnh và 3 đỉnh" }
    ];

    function startMathGeometryGame() {
      currentMode = 'mathGeometry';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathGeometry', MATH_GEOMETRY);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-rose-100 hover:bg-rose-200 text-rose-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-rose-50/50 border-2 border-dashed border-rose-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-6xl mb-2">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-rose-400 hover:bg-rose-50 text-rose-800 font-black text-lg py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_LENGTH = [
      { visual: "📏", question: "1 đề-xi-mét (1 dm) bằng bao nhiêu xăng-ti-mét (cm)?", choices: ["10 cm", "1 cm", "100 cm", "5 cm"], answer: "10 cm" }
    ];

    function startMathLengthGame() {
      currentMode = 'mathLength';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathLength', MATH_LENGTH);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-cyan-100 hover:bg-cyan-200 text-cyan-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-cyan-50/50 border-2 border-dashed border-cyan-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-6xl mb-2">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-cyan-400 hover:bg-cyan-50 text-cyan-800 font-black text-lg py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_MASS_LIT = [
      { visual: "⚖️", question: "Bao gạo nặng 35 kg, mẹ dùng 15 kg. Hỏi còn lại bao nhiêu kg gạo?", choices: ["20 kg", "25 kg", "15 kg", "30 kg"], answer: "20 kg" }
    ];

    function startMathMassLitGame() {
      currentMode = 'mathMassLit';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathMassLit', MATH_MASS_LIT);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-emerald-50/50 border-2 border-dashed border-emerald-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-6xl mb-2">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-emerald-400 hover:bg-emerald-50 text-emerald-800 font-black text-lg py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_CLOCK = [
      { visual: "🕒", question: "Kim ngắn chỉ số 3, kim dài chỉ số 12. Đồng hồ chỉ mấy giờ?", choices: ["3 giờ đúng", "12 giờ đúng", "3 giờ 15 phút", "4 giờ"], answer: "3 giờ đúng" }
    ];

    function startMathClockGame() {
      currentMode = 'mathClock';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathClock', MATH_CLOCK);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-orange-100 hover:bg-orange-200 text-orange-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-orange-50/50 border-2 border-dashed border-orange-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-6xl mb-2">${q.visual}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-orange-400 hover:bg-orange-50 text-orange-800 font-black text-lg py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_WORD_PROBLEMS = [
      { story: "Mai có 18 bông hoa. Lan có nhiều hơn Mai 7 bông hoa. Hỏi Lan có bao nhiêu bông hoa?", choices: ["25 bông", "24 bông", "23 bông", "26 bông"], answer: "25 bông" }
    ];

    function startMathWordGame() {
      currentMode = 'mathWord';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathWord', MATH_WORD_PROBLEMS);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-lg md:text-xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.story}</span>
          <button class="btn-bounce bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.story}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-indigo-50/50 border-2 border-dashed border-indigo-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-5xl">🌸 🚌 🐥</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-indigo-400 hover:bg-indigo-50 text-indigo-800 font-black text-xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, '${c}')">${c}</button>`).join('')}
        </div>
      `;
    }

    const MATH_FIND_X = [
      { question: "Tìm x, biết: x + 15 = 40", equation: "x + 15 = 40 ➔ x = ?", choices: [25, 30, 20, 35], answer: 25 }
    ];

    function startMathFindXGame() {
      currentMode = 'mathFindX';
      btnBackMenu.classList.remove('hidden');
      const q = getNextItemFromPool('pool_mathFindX', MATH_FIND_X);
      currentAnswer = q.answer;
      container.innerHTML = `
        <div class="text-xl md:text-2xl font-black text-gray-800 mb-4 flex items-center justify-center gap-3">
          <span>${q.question}</span>
          <button class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-700 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-sm" onclick="speakClear('${q.question}', 'vi')">🔊 Nghe</button>
        </div>
        <div class="bg-pink-50/50 border-2 border-dashed border-pink-200 rounded-3xl p-6 w-full max-w-xl mb-6 flex flex-col items-center">
          <div class="text-3xl md:text-4xl font-black text-pink-600 font-cute tracking-wider">${q.equation}</div>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full max-w-md">
          ${q.choices.map(c => `<button class="btn-bounce bg-white border-4 border-pink-400 hover:bg-pink-50 text-pink-800 font-black text-2xl py-3 rounded-2xl shadow-md transition" onclick="checkChoiceAnswer(this, ${c})">${c}</button>`).join('')}
        </div>
      `;
    }

    function checkChoiceAnswer(btnElement, selected) {
      if (selected === currentAnswer) {
        btnElement.classList.add('!bg-blue-500', '!text-white', '!border-blue-600');
        playTone('correct');
        addStars(1);

        const allBtns = container.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);

        speakClear("Chính xác! Bé giỏi quá!", "vi", () => {
          setTimeout(nextQuestion, 1100);
        });
      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        playTone('wrong');
        speakClear("Chưa đúng rồi, con tính lại nhé!", "vi");

        setTimeout(() => {
          btnElement.classList.remove('!bg-rose-500', '!text-white', '!border-rose-600');
        }, 1100);
      }
    }

    function nextQuestion() {
      switch(currentMode) {
        case 'mathLogic': startMathLogicGame(); break;
        case 'mathAddSub': startMathAddSubGame(); break;
        case 'mathMult': startMathMultGame(); break;
        case 'mathDiv': startMathDivGame(); break;
        case 'mathGeometry': startMathGeometryGame(); break;
        case 'mathLength': startMathLengthGame(); break;
        case 'mathMassLit': startMathMassLitGame(); break;
        case 'mathClock': startMathClockGame(); break;
        case 'mathWord': startMathWordGame(); break;
        case 'mathFindX': startMathFindXGame(); break;
        default: openMathMenu(); break;
      }
    }
  </script>
</body>
</html>
