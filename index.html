<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vườn Tri Thức Toán Lớp 2 - Em Học Vui</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #EC4899;
      --secondary: #8B5CF6;
      --accent: #F59E0B;
      --dark: #374151;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FDF2F8 0%, #F5F3FF 50%, #EFF6FF 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: var(--dark);
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1080px;
      min-height: 780px;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(236, 72, 153, 0.18);
      border: 6px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-5px) scale(1.02);
    }
    .btn-bounce:active {
      transform: scale(0.94);
    }
    .seq-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #FFF;
      border: 3px solid #F472B6;
      color: #DB2777;
      font-size: 20px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #F472B6;
    }
    .seq-box.target {
      background: #FEF3C7;
      border-color: #F59E0B;
      color: #D97706;
      box-shadow: 0 4px 0 #D97706;
      animation: pulse-target 1.3s infinite;
    }
    @keyframes pulse-target {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .nav-btn {
      transition: all 0.2s ease;
    }
    .nav-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-purple-600/95 to-indigo-600/95 z-50 flex flex-col items-center justify-center p-6 text-center text-white">
      <div class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-6xl shadow-2xl mb-4 transform -rotate-6 animate-bounce">
        🐰
      </div>
      <h1 class="text-3xl md:text-5xl font-black font-cute mb-3 tracking-wide">🌸 VƯỜN TOÁN LỚP 2 🌸</h1>
      <p class="text-base md:text-lg font-bold max-w-lg mb-6 leading-relaxed text-pink-100">
        Bé cùng Thỏ Hồng chinh phục các phép tính cộng trừ, bảng nhân chia và bài toán hay từ Sách Giáo Khoa nhé! ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-950 text-2xl md:text-3xl font-black px-10 py-4 md:py-5 rounded-full shadow-2xl border-4 border-white transition flex items-center space-x-3">
        <span>✨ BẮT ĐẦU HỌC NGAY ✨</span>
      </button>
    </div>

    <!-- HEADER -->
    <header class="bg-white/95 backdrop-blur-md px-4 sm:px-6 py-3.5 flex justify-between items-center border-b-2 border-pink-100 z-10 gap-2">
      <!-- Nút Menu & Tab Chủ đề -->
      <div class="flex items-center space-x-2">
        <button id="btn-back-menu" onclick="openMathMenu()" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-700 border-2 border-pink-200 font-extrabold px-3 py-1.5 rounded-2xl text-xs md:text-sm flex items-center space-x-1.5 shadow-sm hidden">
          <span>🏠 Menu Chủ Đề</span>
        </button>
        <div id="topic-tab-badge" class="hidden sm:flex items-center gap-1.5 bg-purple-50 text-purple-700 border-2 border-purple-200 font-black px-3 py-1.5 rounded-2xl text-xs md:text-sm shadow-sm">
          <span>🏷️</span>
          <span id="topic-tab-text">Chủ đề</span>
        </div>
      </div>

      <!-- Tiêu đề chính -->
      <div class="flex items-center justify-center">
        <h1 class="text-base sm:text-xl md:text-2xl font-black font-cute tracking-wide drop-shadow-sm flex items-center gap-1.5 cursor-pointer" onclick="openMathMenu()">
          <span>🎀</span>
          <span class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">TOÁN HỌC LỚP 2</span>
          <span>🎀</span>
        </h1>
      </div>

      <!-- Sao & Mascot -->
      <div class="flex items-center space-x-2">
        <div class="flex items-center space-x-1.5 bg-amber-50 border-2 border-amber-300 px-3 py-1 rounded-2xl shadow-inner">
          <span class="text-lg md:text-xl animate-spin" style="animation-duration: 4s;">⭐</span>
          <span id="stars-count" class="text-lg md:text-xl font-black text-amber-600">0</span>
          <span class="text-[11px] font-black text-amber-500 hidden md:inline">Sao</span>
        </div>
        <button onclick="speakMascotCheer()" class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-700 border border-pink-300 px-3 py-1.5 rounded-2xl text-xs font-black flex items-center space-x-1 shadow-sm">
          <span>🐰 Cổ vũ</span>
        </button>
      </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main id="main-content" class="flex-1 p-4 md:p-6 flex flex-col items-center justify-center text-center overflow-y-auto">
      <!-- Màn chơi hiển thị động -->
    </main>

  </div>

  <script>
    let stars = parseInt(localStorage.getItem('stars_math_lop2') || '0');
    let currentTopicName = "";
    let currentQuestionList = [];
    let currentQuestionIndex = 0;
    let selectedAnswerState = {}; // Lưu trạng thái trả lời của từng câu

    let audioCtx = null;
    const onlineAudioPlayer = new Audio();

    document.getElementById('stars-count').innerText = stars;

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      speakClear("Chào bé yêu! Thỏ Hồng chúc con học Toán thật giỏi và rinh thật nhiều ngôi sao lấp lánh nhé!", "vi");
      document.getElementById('start-overlay').style.display = 'none';
      openMathMenu();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(170, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function speakClear(text, lang = 'vi', onEndCallback = null) {
      try {
        onlineAudioPlayer.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        let cleanText = String(text || '')
          .replace(/\+/g, ' cộng ')
          .replace(/-/g, ' trừ ')
          .replace(/×/g, ' nhân ')
          .replace(/\*/g, ' nhân ')
          .replace(/:/g, ' chia ')
          .replace(/\//g, ' chia ')
          .replace(/=/g, ' bằng ')
          .replace(/kg/gi, ' ki-lô-gam ')
          .replace(/\bl\b/gi, ' lít ')
          .replace(/dm/gi, ' đề-xi-mét ')
          .replace(/cm/gi, ' xăng-ti-mét ')
          .replace(/\bm\b/gi, ' mét ')
          .replace(/\?/g, ' mấy ');

        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;

        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.95;
        onlineAudioPlayer.onended = () => {
          if (typeof onEndCallback === 'function') onEndCallback();
        };
        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackWebSpeech(cleanText, onEndCallback);
          });
        }
      } catch (err) {
        fallbackWebSpeech(text, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.92;
      utterance.pitch = 1.08;

      const voices = window.speechSynthesis.getVoices();
      const vietVoice = voices.find(v => (v.lang === 'vi-VN' || v.lang.startsWith('vi')) && (v.name.includes('HoaiMy') || v.name.includes('Linh') || v.name.includes('Female') || v.name.includes('Google')));
      if (vietVoice) utterance.voice = vietVoice;

      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      const cheers = [
        "Bé gái của Thỏ Hồng học giỏi và thông minh lắm!",
        "Tuyệt vời quá con ơi, rinh thêm nhiều ngôi sao lấp lánh nào!",
        "Thỏ Hồng chúc bé yêu luôn chăm ngoan và học giỏi môn Toán nhé!",
        "Con làm bài rất cẩn thận, Thỏ Hồng tự hào về con lắm!"
      ];
      speakClear(cheers[Math.floor(Math.random() * cheers.length)], "vi");
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_math_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({
        particleCount: 50,
        spread: 70,
        origin: { y: 0.7 },
        colors: ['#EC4899', '#8B5CF6', '#F59E0B', '#10B981', '#3B82F6']
      });
    }

    const container = document.getElementById('main-content');
    const btnBackMenu = document.getElementById('btn-back-menu');
    const topicTabBadge = document.getElementById('topic-tab-badge');
    const topicTabText = document.getElementById('topic-tab-text');

    function updateHeaderTopic(name) {
      currentTopicName = name;
      if (name) {
        btnBackMenu.classList.remove('hidden');
        topicTabBadge.classList.remove('hidden');
        topicTabText.innerText = name;
      } else {
        btnBackMenu.classList.add('hidden');
        topicTabBadge.classList.add('hidden');
        topicTabText.innerText = "";
      }
    }

    // ==========================================
    // MENU CHÍNH
    // ==========================================
    function openMathMenu() {
      updateHeaderTopic("");
      container.innerHTML = `
        <div class="mb-5">
          <h2 class="text-2xl md:text-3xl font-black text-pink-600 font-cute">🌸 CÁC CHỦ ĐỀ TOÁN LỚP 2 CHUẨN SGK 🌸</h2>
          <p class="text-xs md:text-sm font-bold text-gray-500">Bé chọn chuyên mục yêu thích để cùng Thỏ Hồng ôn luyện nhé!</p>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5 w-full max-w-5xl">
          <div onclick="startTopic('Dãy Số & Tia Số', MATH_LOGIC_BANK)" class="card-hover bg-white border-2 border-purple-200 hover:border-purple-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">🧩</div>
            <h3 class="text-xs md:text-sm font-black text-purple-700">1. Dãy Số & Tia Số</h3>
          </div>
          
          <!-- MỤC SỐ 2: PHÉP TÍNH CỘNG TRỪ -->
          <div onclick="openAddSubMenu()" class="card-hover bg-white border-2 border-pink-300 hover:border-pink-500 rounded-3xl p-3.5 text-center cursor-pointer shadow-md bg-gradient-to-b from-pink-50/50 to-white ring-2 ring-pink-200">
            <div class="text-3xl mb-1 text-pink-500 font-black">➕ ➖</div>
            <h3 class="text-xs md:text-sm font-black text-pink-700">2. Phép Tính Cộng Trừ</h3>
          </div>

          <div onclick="startTopic('Bảng Nhân 2 & 5', MATH_MULT)" class="card-hover bg-white border-2 border-amber-200 hover:border-amber-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">✖️</div>
            <h3 class="text-xs md:text-sm font-black text-amber-700">3. Bảng Nhân 2 & 5</h3>
          </div>
          <div onclick="startTopic('Bảng Chia 2 & 5', MATH_DIV)" class="card-hover bg-white border-2 border-teal-200 hover:border-teal-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">➗</div>
            <h3 class="text-xs md:text-sm font-black text-teal-700">4. Bảng Chia 2 & 5</h3>
          </div>
          <div onclick="startTopic('Hình Học Cơ Bản', MATH_GEOMETRY)" class="card-hover bg-white border-2 border-rose-200 hover:border-rose-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📐</div>
            <h3 class="text-xs md:text-sm font-black text-rose-700">5. Hình Học Cơ Bản</h3>
          </div>
          <div onclick="startTopic('Đo Độ Dài & Cây Cầu', MATH_LENGTH)" class="card-hover bg-white border-2 border-cyan-200 hover:border-cyan-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📏</div>
            <h3 class="text-xs md:text-sm font-black text-cyan-700">6. Đo Độ Dài & Cây Cầu</h3>
          </div>
          <div onclick="startTopic('Đơn Vị Lít & Ki-lô-gam', MATH_MASS_LIT)" class="card-hover bg-white border-2 border-emerald-200 hover:border-emerald-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">⚖️</div>
            <h3 class="text-xs md:text-sm font-black text-emerald-700">7. Đơn Vị Lít & Ki-lô-gam</h3>
          </div>
          <div onclick="startTopic('Xem Giờ & Lịch', MATH_CLOCK)" class="card-hover bg-white border-2 border-orange-200 hover:border-orange-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">⏰</div>
            <h3 class="text-xs md:text-sm font-black text-orange-700">8. Xem Giờ & Lịch</h3>
          </div>
          <div onclick="startTopic('Bài Toán Lời Văn', MATH_WORD_PROBLEMS)" class="card-hover bg-white border-2 border-indigo-200 hover:border-indigo-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">📖</div>
            <h3 class="text-xs md:text-sm font-black text-indigo-700">9. Bài Toán Lời Văn</h3>
          </div>
          <div onclick="startTopic('Thành Phần Chưa Biết', MATH_FIND_X)" class="card-hover bg-white border-2 border-fuchsia-200 hover:border-fuchsia-400 rounded-3xl p-3.5 text-center cursor-pointer shadow-sm">
            <div class="text-3xl mb-1">🔍</div>
            <h3 class="text-xs md:text-sm font-black text-fuchsia-700">10. Thành Phần Chưa Biết</h3>
          </div>
        </div>
      `;
    }

    // ==========================================
    // MENU PHÂN MỤC CHO PHÉP TÍNH CỘNG TRỪ (MỤC 2)
    // ==========================================
    function openAddSubMenu() {
      updateHeaderTopic("Phép Tính Cộng Trừ");
      container.innerHTML = `
        <div class="mb-6">
          <h2 class="text-2xl md:text-3xl font-black text-pink-600 font-cute">➕ PHÉP TÍNH CỘNG TRỪ ➖</h2>
          <p class="text-xs md:text-sm font-bold text-gray-500">Bé chọn phạm vi số muốn luyện tập nhé!</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl px-4">
          <div onclick="startTopic('Cộng Trừ Tới 100', MATH_ADD_SUB_100)" class="card-hover bg-white border-4 border-pink-300 hover:border-pink-500 rounded-3xl p-6 text-center cursor-pointer shadow-lg bg-gradient-to-b from-pink-50/60 to-white">
            <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center text-3xl font-black mx-auto mb-3 shadow-inner">
              💯
            </div>
            <h3 class="text-lg md:text-xl font-black text-pink-700 mb-1">1. Cộng Trừ Tới 100</h3>
            <p class="text-xs font-bold text-gray-500">Phép cộng, trừ có nhớ & không nhớ trong phạm vi 100, tháp số, tách số tròn 10</p>
          </div>

          <div onclick="startTopic('Cộng Trừ Từ 100 Tới 1000', MATH_ADD_SUB_1000)" class="card-hover bg-white border-4 border-purple-300 hover:border-purple-500 rounded-3xl p-6 text-center cursor-pointer shadow-lg bg-gradient-to-b from-purple-50/60 to-white">
            <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-3xl font-black mx-auto mb-3 shadow-inner">
              🔢
            </div>
            <h3 class="text-lg md:text-xl font-black text-purple-700 mb-1">2. Cộng Trừ Từ 100 Tới 1000</h3>
            <p class="text-xs font-bold text-gray-500">Cộng trừ các số có 3 chữ số, đặt tính rồi tính, tính nhẩm tròn trăm</p>
          </div>
        </div>
        <div class="mt-8">
          <button onclick="openMathMenu()" class="btn-bounce bg-gray-100 hover:bg-gray-200 text-gray-700 font-black px-6 py-2.5 rounded-2xl text-sm border-2 border-gray-300 shadow-sm">
            ⬅️ Quay lại Menu Chính
          </button>
        </div>
      `;
    }

    // ==========================================
    // KHỞI ĐỘNG VÀ ĐIỀU HƯỚNG CHỦ ĐỀ
    // ==========================================
    function startTopic(topicName, dataArray) {
      updateHeaderTopic(topicName);
      currentQuestionList = [...dataArray];
      currentQuestionIndex = 0;
      selectedAnswerState = {};
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestionList[currentQuestionIndex];
      const isFirst = currentQuestionIndex === 0;
      const isLast = currentQuestionIndex === currentQuestionList.length - 1;
      const answered = selectedAnswerState[currentQuestionIndex];

      let centerContent = '';
      if (q.sequence) {
        const seqHtml = q.sequence.map(item => item === "?" ? `<div class="seq-box target">?</div>` : `<div class="seq-box">${item}</div>`).join('');
        centerContent = `
          <div class="flex flex-wrap gap-2 justify-center mb-3">${seqHtml}</div>
          <div class="text-sm font-extrabold text-purple-600 bg-purple-50 px-3 py-1 rounded-full">Quy luật: ${q.rule}</div>
        `;
      } else {
        centerContent = `
          ${q.visual ? `<div class="text-2xl md:text-3xl mb-2">${q.visual}</div>` : ''}
          <div class="text-3xl md:text-4xl font-black text-pink-600 font-cute tracking-wider">${q.mathText || q.question}</div>
        `;
      }

      const speakPrompt = q.sequence ? q.sequence.join(', ').replace('?', 'chấm hỏi') : (q.mathText || q.question || q.visual);

      container.innerHTML = `
        <div class="flex items-center justify-between w-full max-w-xl mb-2">
          <div class="source-badge bg-pink-100 text-pink-700 border border-pink-200">${q.source}</div>
          <div class="text-xs font-black text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
            Câu ${currentQuestionIndex + 1} / ${currentQuestionList.length}
          </div>
        </div>

        <div class="text-base sm:text-lg md:text-xl font-black text-gray-800 mb-3 flex items-center justify-center gap-2 max-w-2xl">
          <span>${q.question || "Chọn đáp án đúng"}</span>

    function checkChoiceAnswer(btnElement, selected) {
      const q = currentQuestionList[currentQuestionIndex];
      const isCorrect = String(selected) === String(q.answer);
      const fb = document.getElementById('feedback-msg');

      selectedAnswerState[currentQuestionIndex] = { selected, isCorrect };

      const allBtns = container.querySelectorAll('.choice-btn');
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        playTone('correct');
        addStars(1);
        fb.innerHTML = `<span class="text-emerald-600 font-extrabold">🌟 Bé trả lời chính xác! Nhấn "Câu Sau ➡️" để tiếp tục nhé!</span>`;

        const praises = ["Chính xác! Bé thông minh quá!", "Đúng rồi! Bé của Thỏ giỏi lắm!", "Xuất sắc! Thêm một ngôi sao sáng lấp lánh!"];
        const cheerText = praises[Math.floor(Math.random() * praises.length)];
        speakClear(cheerText, "vi");
      } else {
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600');
        playTone('wrong');
        fb.innerHTML = `<span class="text-rose-600 font-extrabold">💡 Chưa đúng rồi! Đáp án đúng là: ${q.answer}. Nhấn "Câu Sau ➡️" nhé!</span>`;
        speakClear(`Chưa đúng rồi! Đáp án đúng là ${q.answer}`, "vi");
      }
    }
