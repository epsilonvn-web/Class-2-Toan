  <style>
    :root {
      --primary: #EC4899;
      --secondary: #8B5CF6;
      --accent: #F59E0B;
      --dark: #1F2937;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FDF2F8 0%, #F5F3FF 50%, #EFF6FF 100%);
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--dark);
      overflow: hidden;
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1180px;
      height: 97vh;
      max-height: 780px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(236, 72, 153, 0.18);
      border: 3px solid #FFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .card-hover {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-2px) scale(1.02);
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .seq-box {
      min-width: 52px;
      height: 52px;
      padding: 0 10px;
      border-radius: 14px;
      background: #FFF;
      border: 3px solid #F472B6;
      color: #DB2777;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #F472B6;
    }
    .seq-box.target {
      background: #FEF3C7;
      border-color: #F59E0B;
      color: #D97706;
      box-shadow: 0 3px 0 #D97706;
      animation: pulse-target 1.3s infinite;
    }
    @keyframes pulse-target {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
    }
    .nav-btn {
      transition: all 0.2s ease;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FDF2F8;
    }
    ::-webkit-scrollbar-thumb {
      background: #F472B6;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- MÀN HÌNH BẮT ĐẦU VÀ KÍCH HOẠT ÂM THANH -->
    <div id="start-overlay" class="absolute inset-0 bg-gradient-to-br from-pink-500/95 via-purple-600/95 to-indigo-600/95 z-50 flex flex-col items-center justify-center p-4 text-center text-white">
      <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center text-5xl shadow-2xl mb-4 transform -rotate-6 animate-bounce">
        🐰

        Bé cùng Thỏ Hồng xem bài giảng sinh động, học toàn bộ kiến thức SGK và thử sức với ngân hàng đề thi kì 1, kì 2, Olympic / Violympic cùng 100 câu tư duy logic nhé! ✨
      </p>
      <button onclick="initAppAudio()" class="btn-bounce bg-amber-300 hover:bg-amber-200 text-amber-950 text-xl md:text-2xl font-black px-8 py-3.5 rounded-full shadow-2xl border-3 border-white transition flex items-center space-x-2">
        <span>✨ BẮT ĐẦU HỌC NGAY ✨</span>

    <!-- MODAL BÀI GIẢNG / LÝ THUYẾT TRỌNG TÂM -->

    <!-- HEADER: THANH ĐIỀU HƯỚNG BREADCRUMB -->
    <header class="bg-white/95 backdrop-blur-md px-4 py-2 flex justify-between items-center border-b border-pink-100 z-10 gap-2 flex-shrink-0">

      <div class="flex items-center justify-center">

    <!-- NỘI DUNG CHÍNH -->
    <main id="main-content" class="flex-1 px-5 py-3 flex flex-col items-center justify-between text-center overflow-hidden"></main>

  </div>

  <script>
    let stars = parseInt(localStorage.getItem('stars_math_lop2') || '0');
    let currentTopicId = "";
    let currentTopicName = "";
    let currentQuestionList = [];
    let currentQuestionIndex = 0;
    let selectedAnswerState = {};

    let audioCtx = null;
    const onlineAudioPlayer = new Audio();
    let currentAudioToken = 0;

    document.getElementById('stars-count').innerText = stars;

    const container = document.getElementById('main-content');
    const breadcrumbContainer = document.getElementById('breadcrumb-container');

    function stopAllSpeech() {
      currentAudioToken++;
      if (onlineAudioPlayer) {
        onlineAudioPlayer.pause();
        onlineAudioPlayer.removeAttribute('src');
        onlineAudioPlayer.onended = null;
        onlineAudioPlayer.onerror = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initAppAudio() {
      stopAllSpeech();
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      document.getElementById('start-overlay').style.display = 'none';
      openMathMenu();
      
      setTimeout(() => {
        speakClear("Chào bé yêu! Thỏ Hồng chúc con học Toán thật vui, ôn luyện đề thi học kì 1, học kì 2 và Olympic thật xuất sắc nhé!", "vi");
      }, 300);
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.16);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(170, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    function splitTextForTTS(text) {
      const MAX_LEN = 160;
      if (text.length <= MAX_LEN) return [text];
      const parts = [];
      const sentences = text.match(/[^.!?…\n]+[.!?…\n]*\s*/g) || [text];
      let current = '';
      sentences.forEach(sentence => {
        if ((current + sentence).length > MAX_LEN) {
          if (current.trim()) parts.push(current.trim());
          if (sentence.length > MAX_LEN) {
            const words = sentence.split(' ');
            let chunk = '';
            words.forEach(w => {
              if ((chunk + ' ' + w).trim().length > MAX_LEN) {
                if (chunk.trim()) parts.push(chunk.trim());
                chunk = w;
              } else {
                chunk = (chunk + ' ' + w).trim();
              }
            });
            if (chunk.trim()) parts.push(chunk.trim());
            current = '';
          } else {
            current = sentence;
          }
        } else {
          current += sentence;
        }
      });
      if (current.trim()) parts.push(current.trim());
      return parts.filter(Boolean);
    }

    function playGoogleTTSChunks(cleanText, onEndCallback) {
      const thisToken = ++currentAudioToken;
      const chunks = splitTextForTTS(cleanText);
      let i = 0;
      const playNext = () => {
        if (thisToken !== currentAudioToken) return;
        if (i >= chunks.length) {
          if (typeof onEndCallback === 'function') onEndCallback();
          return;
        }
        const encoded = encodeURIComponent(chunks[i].trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;
        onlineAudioPlayer.src = ttsUrl;
        onlineAudioPlayer.playbackRate = 0.95;
        onlineAudioPlayer.onended = () => { 
          if (thisToken === currentAudioToken) {
            i++; 
            playNext(); 
          }
        };
        onlineAudioPlayer.onerror = () => { 
          if (thisToken === currentAudioToken) {
            fallbackWebSpeech(cleanText, onEndCallback); 
          }
        };
        const playPromise = onlineAudioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => { 
            if (thisToken === currentAudioToken) {
              fallbackWebSpeech(cleanText, onEndCallback); 
            }
          });
        }
      };
      playNext();
    }

    function speakClear(text, lang = 'vi', onEndCallback = null) {
      try {
        stopAllSpeech();
        let cleanText = String(text || '')
          .replace(/<[^>]*>/g, ' ')
          .replace(/\+/g, ' cộng ')
          .replace(/-/g, ' trừ ')
          .replace(/×/g, ' nhân ')
          .replace(/\*/g, ' nhân ')
          .replace(/:/g, ' chia ')
          .replace(/\//g, ' chia ')
          .replace(/=/g, ' bằng ')
          .replace(/kg/gi, ' ki-lô-gam ')
          .replace(/\bg\b/gi, ' gam ')
          .replace(/\bl\b/gi, ' lít ')
          .replace(/ml/gi, ' mi-li-lít ')
          .replace(/dm/gi, ' đề-xi-mét ')
          .replace(/cm/gi, ' xăng-ti-mét ')
          .replace(/mm/gi, ' mi-li-mét ')
          .replace(/km/gi, ' ki-lô-mét ')
          .replace(/\?/g, ' mấy ')
          .trim();

        playGoogleTTSChunks(cleanText, onEndCallback);
      } catch (err) {
        fallbackWebSpeech(text, onEndCallback);
      }
    }

    function fallbackWebSpeech(text, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (typeof onEndCallback === 'function') onEndCallback();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ' '));
      utterance.lang = 'vi-VN';
      utterance.rate = 0.95;
      utterance.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const vietVoice = voices.find(v => (v.lang === 'vi-VN' || v.lang.startsWith('vi')) && (v.name.includes('HoaiMy') || v.name.includes('Linh') || v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Ban Mai')));
      if (vietVoice) utterance.voice = vietVoice;

      utterance.onend = () => {
        if (typeof onEndCallback === 'function') onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakMascotCheer() {
      stopAllSpeech();
      const cheers = [
        "Bé làm bài rất giỏi, tư duy sắc bén lắm!",
        "Thỏ Hồng chúc mừng con, tuyệt vời lắm!",
        "Chăm chỉ suy luận logic và luyện đề mỗi ngày con nha!",
        "Con thông minh quá, tiếp tục phát huy nào!"
      ];
      const randomCheer = cheers[Math.floor(Math.random() * cheers.length)];
      speakClear(randomCheer, "vi");
    }

    function addStars(num) {
      stars += num;
      localStorage.setItem('stars_math_lop2', stars);
      document.getElementById('stars-count').innerText = stars;
      confetti({
        particleCount: 40,
        spread: 65,
        origin: { y: 0.7 },
        colors: ['#EC4899', '#8B5CF6', '#F59E0B', '#10B981', '#3B82F6']
      });
    }

    function renderBreadcrumb(items) {
      if (!items || items.length === 0) {
        breadcrumbContainer.innerHTML = "";
        return;
      }

      let html = "";
      items.forEach((item, index) => {
        const isLast = index === items.length - 1;
        if (index > 0) {
          html += `<span class="text-pink-300 font-black text-xs md:text-sm px-0.5">/</span>`;
        }

        if (isLast && item.active) {
          html += `
            <div class="bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black px-3.5 py-1 rounded-full text-xs md:text-sm shadow-sm flex items-center gap-1 border border-pink-400">
              <span>${item.icon || '🏷️'}</span>
              <span>${item.name}</span>
            </div>
          `;
        } else {
          html += `
            <button onclick="${item.action}" class="btn-bounce bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-300 font-black px-3 py-1 rounded-full text-xs md:text-sm flex items-center gap-1 shadow-sm transition">
              <span>${item.icon || '📁'}</span>
              <span>${item.name}</span>
            </button>
          `;
        }
      });
      breadcrumbContainer.innerHTML = html;
    }

    // =========================================================================
    // MENU CHÍNH DASHBOARD (15 CHỦ ĐỀ TOÁN HỌC & ĐỀ THI SGK)
    // =========================================================================
    function openMathMenu() {
      stopAllSpeech();
      renderBreadcrumb([]);
      currentTopicId = "";
      currentTopicName = "";

      container.innerHTML = `
        <div class="my-auto w-full max-w-5xl flex flex-col items-center">
          <div class="mb-3">
            <h2 class="text-xl md:text-2xl font-black text-pink-600 font-cute">🌸 CÁC BÀI TOÁN LỚP 2 CHUẨN SGK & BỘ ĐỀ THI ÔN LUYỆN 🌸</h2>
            <p class="text-xs md:text-sm font-bold text-gray-500">Mỗi chủ đề và đề thi đều được xáo trộn ngẫu nhiên hoàn toàn!</p>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 w-full">
            <div onclick="startTopic('topic_1', '1. Dãy Số & Quy Luật', getExpandedQuestions(MATH_LOGIC_BANK, 'logic'), [{name: 'Menu', action: 'openMathMenu()', icon: '🏠'}, {name: '1. Dãy Số & Quy Luật', active: true, icon: '🧩'}])" class="card-hover bg-white border-2 border-purple-200 hover:border-purple-400 rounded-2xl p-2.5 text-center cursor-pointer shadow-sm">
              <div class="text-2xl mb-1">🧩</div>
              <h3 class="text-xs md:text-sm font-black text-purple-700 leading-tight">1. Dãy Số & Quy Luật</h3>
            </div>
            
            <div onclick="openAddSubMenu()" class="card-hover bg-white border-2 border-pink-300 hover:border-pink-500 rounded-2xl p-2.5 text-center cursor-pointer shadow-sm bg-gradient-to-b from-pink-50/50 to-white ring-1 ring-pink-200">
              <div class="text-2xl mb-1 text-pink-500 font-black">➕ ➖</div>
              <h3 class="text-xs md:text-sm font-black text-pink-700 leading-tight">2. Phép Tính Cộng Trừ</h3>
            </div>

            <div onclick="openMultDivMenu()" class="card-hover bg-white border-3 border-amber-300 hover:border-amber-500 rounded-2xl p-2.5 text-center cursor-pointer shadow-md bg-gradient-to-b from-amber-50/70 to-white ring-2 ring-amber-300">
              <div class="text-2xl mb-1 text-amber-600 font-black">✖️ ➗</div>
              <h3 class="text-xs md:text-sm font-black text-amber-800 leading-tight">3. Phép Nhân & Chia</h3>
            </div>

            <div onclick="startTopic('topic_4_geom', '4. Hình Học & Khối Hình', getExpandedQuestions(MATH_GEOMETRY_ALL, 'geom'), [{name: 'Menu', action: 'openMathMenu()', icon: '🏠'}, {name: '4. Hình Học & Khối Hình', active: true, icon: '📐'}])" class="card-hover bg-white border-2 border-rose-200 hover:border-rose-400 rounded-2xl p-2.5 text-center cursor-pointer shadow-sm bg-gradient-to-b from-rose-50/40 to-white">
              <div class="text-2xl mb-1">📐 🧊</div>
              <h3 class="text-xs md:text-sm font-black text-rose-700 leading-tight">4. Hình Học & Khối Hình</h3>
            </div>

            <div onclick="openMeasurementTimeMenu()" class="card-hover bg-white border-3 border-cyan-400 hover:border-cyan-600 rounded-2xl p-2.5 text-center cursor-pointer shadow-md bg-gradient-to-b from-cyan-50/70 to-white ring-2 ring-cyan-300">
              <div class="text-2xl mb-1 text-cyan-600 font-black">📏 ⚖️ ⏰</div>
              <h3 class="text-xs md:text-sm font-black text-cyan-800 leading-tight">5. Đơn Vị Đo & Thời Gian</h3>
            </div>

            <div onclick="startTopic('topic_8', '6. Bài Toán Lời Văn', getExpandedQuestions(MATH_WORD_PROBLEMS, 'word'), [{name: 'Menu', action: 'openMathMenu()', icon: '🏠'}, {name: '6. Bài Toán Lời Văn', active: true, icon: '📖'}])" class="card-hover bg-white border-2 border-indigo-200 hover:border-indigo-400 rounded-2xl p-2.5 text-center cursor-pointer shadow-sm">
              <div class="text-2xl mb-1">📖</div>
              <h3 class="text-xs md:text-sm font-black text-indigo-700 leading-tight">6. Bài Toán Lời Văn</h3>
            </div>

            <div onclick="startTopic('topic_10', '7. Lời Văn Nâng Cao', getExpandedQuestions(MATH_WORD_ADVANCED, 'word_adv'), [{name: 'Menu', action: 'openMathMenu()', icon: '🏠'}, {name: '7. Lời Văn Nâng Cao', active: true, icon: '🌟'}])" class="card-hover bg-white border-2 border-red-200 hover:border-red-400 rounded-2xl p-2.5 text-center cursor-pointer shadow-sm bg-gradient-to-b from-red-50/50 to-white ring-1 ring-red-200">
              <div class="text-2xl mb-1">🌟</div>

    let currentBreadcrumbItems = [];

    function startTopic(topicId, topicName, dataArray, breadcrumbItems = []) {
      stopAllSpeech();
      currentTopicId = topicId;
      currentTopicName = topicName;
      currentBreadcrumbItems = breadcrumbItems;

      renderBreadcrumb(breadcrumbItems);
      
      const shuffledQuestions = shuffleArray(dataArray);

      currentQuestionList = shuffledQuestions.map(q => {
        return {
          ...q,
          choices: shuffleArray(q.choices)
        };
      });

      currentQuestionIndex = 0;
      selectedAnswerState = {};
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestionList[currentQuestionIndex];
      const isFirst = currentQuestionIndex === 0;
      const isLast = currentQuestionIndex === currentQuestionList.length - 1;
      const state = selectedAnswerState[currentQuestionIndex] || { isCorrect: false, wrongList: [] };

      let centerContent = '';
      if (q.sequence) {
        const seqHtml = q.sequence.map(item => item === "?" ? `<div class="seq-box target">?</div>` : `<div class="seq-box">${item}</div>`).join('');
        centerContent = `
          <div class="flex flex-wrap gap-2.5 justify-center mb-2.5">${seqHtml}</div>
          <div class="text-sm md:text-base font-extrabold text-purple-700 bg-purple-50 px-4 py-1.5 rounded-full border border-purple-200">💡 Quy luật: ${q.rule}</div>
        `;
      } else {
        centerContent = `
          ${q.visual ? `<div class="text-base md:text-lg font-black text-purple-900 bg-purple-50/90 px-5 py-2.5 rounded-2xl border-2 border-purple-200 mb-2.5 max-w-3xl shadow-sm leading-snug">${q.visual}</div>` : ''}
          <div class="text-xl md:text-2xl font-black text-pink-700 font-cute leading-snug max-w-3xl px-2 drop-shadow-sm">
            ${q.mathText || q.question}
          </div>
        `;
      }

      const speakPrompt = q.sequence ? q.sequence.join(', ').replace('?', 'chấm hỏi') : (q.visual ? `${q.visual}. ${q.mathText || q.question}` : (q.mathText || q.question));

      container.innerHTML = `
        <div class="flex items-center justify-between w-full max-w-4xl pt-0.5 flex-shrink-0">
          <div class="source-badge bg-pink-100 text-pink-800 border border-pink-300 font-black">${q.source}</div>
          <div class="text-sm font-black text-gray-700 bg-gray-100 px-3.5 py-1 rounded-full border border-gray-200 shadow-inner">
            Câu ${currentQuestionIndex + 1} / ${currentQuestionList.length}
          </div>
        </div>

        <div class="text-base md:text-lg font-extrabold text-gray-800 flex items-center justify-center gap-2.5 max-w-3xl flex-shrink-0">
          <span>${q.mathText ? q.question : "Bé hãy suy nghĩ và bấm chọn đáp án đúng nhất:"}</span>
          <button class="btn-bounce bg-pink-100 hover:bg-pink-200 text-pink-800 text-sm md:text-base font-black px-3.5 py-1 rounded-xl flex items-center gap-1.5 border border-pink-300 shadow-sm flex-shrink-0" onclick="speakClear('${speakPrompt.replace(/'/g, "\\'")}', 'vi')">
            🔊 Nghe đọc
          </button>
        </div>

        <div class="bg-gradient-to-b from-pink-50/70 to-purple-50/50 border-2 border-pink-200 rounded-3xl p-4 w-full max-w-4xl flex flex-col items-center justify-center shadow-inner flex-shrink-0 min-h-[120px]">
          ${centerContent}

        <div id="feedback-msg" class="min-h-[28px] text-base md:text-lg font-black transition-all flex items-center justify-center flex-shrink-0"></div>

        <div class="grid grid-cols-2 gap-3.5 w-full max-w-3xl flex-shrink-0">
          ${q.choices.map(c => {
            const isWrong = state.wrongList && state.wrongList.includes(String(c));
            const isCorrect = state.isCorrect && String(c) === String(q.answer);

            let btnClass = "bg-pink-50/40 border-2 border-pink-200 hover:bg-pink-100/60 hover:border-pink-400 text-pink-950";
            let disabledAttr = "";

            if (isCorrect) {
              btnClass = "!bg-emerald-500 !text-white !border-emerald-600 shadow-md";
              disabledAttr = "disabled";
            } else if (isWrong) {
              btnClass = "!bg-rose-500 !text-white !border-rose-600 opacity-60";
              disabledAttr = "disabled";
            } else if (state.isCorrect) {
              disabledAttr = "disabled";
            }

            return `<button class="choice-btn btn-bounce ${btnClass} font-black text-xl md:text-2xl py-3 px-4 rounded-2xl shadow-sm transition leading-snug flex items-center justify-center text-center" onclick="checkChoiceAnswer(this, '${c}')" ${disabledAttr}>${c}</button>`;
          }).join('')}
        </div>

        <div class="flex items-center justify-between w-full max-w-3xl pt-2 border-t border-pink-100 gap-4 pb-0.5 flex-shrink-0">
          <button onclick="prevQuestion()" ${isFirst ? 'disabled' : ''} class="nav-btn btn-bounce flex-1 bg-white hover:bg-pink-50 text-pink-700 border-2 border-pink-300 font-black py-2.5 px-4 rounded-2xl text-base md:text-lg flex items-center justify-center space-x-1.5 shadow-sm">
            <span>⬅️ Câu Trước</span>
          </button>

        const fb = document.getElementById('feedback-msg');
        fb.innerHTML = `<span class="text-emerald-600 font-black text-lg">🌟 Xuất sắc! Nhấn "Câu Sau ➡️" để tiếp tục!</span>`;
      }
    }

    function checkChoiceAnswer(btnElement, selected) {
      stopAllSpeech();
      const q = currentQuestionList[currentQuestionIndex];
      const isCorrect = String(selected) === String(q.answer);
      const fb = document.getElementById('feedback-msg');

      if (!selectedAnswerState[currentQuestionIndex]) {
        selectedAnswerState[currentQuestionIndex] = { isCorrect: false, wrongList: [] };
      }

      if (isCorrect) {
        selectedAnswerState[currentQuestionIndex].isCorrect = true;
        btnElement.classList.remove('bg-pink-50/40', 'border-pink-200', 'hover:bg-pink-100/60', 'text-pink-950');
        btnElement.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-600');
        playTone('correct');
        addStars(1);
        fb.innerHTML = `<span class="text-emerald-600 font-black text-lg">🌟 Xuất sắc! Nhấn "Câu Sau ➡️" để tiếp tục!</span>`;
        speakClear("Xuất sắc!", "vi");

        const allBtns = container.querySelectorAll('.choice-btn');
        allBtns.forEach(b => b.disabled = true);
      } else {
        selectedAnswerState[currentQuestionIndex].wrongList.push(String(selected));
        btnElement.classList.remove('bg-pink-50/40', 'border-pink-200', 'hover:bg-pink-100/60', 'text-pink-950');
        btnElement.classList.add('!bg-rose-500', '!text-white', '!border-rose-600', 'opacity-60');
        btnElement.disabled = true;
        playTone('wrong');
        fb.innerHTML = `<span class="text-rose-600 font-black text-lg">💡 Chưa đúng rồi! Bé hãy suy nghĩ và chọn lại nhé!</span>`;
        speakClear("Chưa đúng rồi", "vi");
      }
    }

    function prevQuestion() {
      stopAllSpeech();
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      stopAllSpeech();
      if (currentQuestionIndex < currentQuestionList.length - 1) {
        currentQuestionIndex++;

    function getExpandedQuestions(baseArray, type, targetCount = 50) {
      let result = [...baseArray];
      let needed = targetCount - result.length;
      if (needed <= 0) return result;

      for (let i = 1; i <= needed; i++) {
        let q = {};
        if (type === 'logic') {
          let start = 100 + i * 15;
          let step = (i % 2 === 0) ? 2 : 5;
          let seq = [start, start + step, start + step * 2, "?", start + step * 4];
          let ans = start + step * 3;
          q = {
            source: "Luyện tập tư duy SGK",
            sequence: seq,
            rule: `Dãy số tăng cách đều ${step} đơn vị (+${step})`,
            answer: ans,
            choices: [ans, ans - 1, ans + 2, ans + step]
          };
        } else if (type === 'add_sub_100') {
          let a = 20 + (i * 3) % 60;
          let b = 15 + (i * 7) % 35;
          if (i % 2 === 0) {
            let ans = a + b;
            q = {
              source: "SGK Luyện tập phạm vi 100",
              mathText: `${a} + ${b} = ?`,
              question: `Tính tổng: ${a} + ${b} = ?`,
              answer: ans,
              choices: [ans, ans + 10, ans - 1, ans + 2]
            };
          } else {
            let total = a + b;
            q = {
              source: "SGK Luyện tập phạm vi 100",
              mathText: `${total} - ${a} = ?`,
              question: `Tính hiệu: ${total} - ${a} = ?`,
              answer: b,
              choices: [b, b + 2, b - 1, b + 10]
            };
          }
        } else if (type === 'add_sub_1000') {
          let a = 150 + i * 12;
          let b = 120 + (i * 9) % 200;
          if (i % 2 === 0) {
            let ans = a + b;
            q = {
              source: "SGK Luyện tập phạm vi 1000",
              mathText: `${a} + ${b} = ?`,
              question: `Đặt tính rồi tính: ${a} + ${b} = ?`,
              answer: ans,
              choices: [ans, ans + 10, ans - 10, ans + 100]
            };
          } else {
            let total = a + b;
            q = {
              source: "SGK Luyện tập phạm vi 1000",
              mathText: `${total} - ${a} = ?`,
              question: `Đặt tính rồi tính: ${total} - ${a} = ?`,
              answer: b,
              choices: [b, b + 10, b - 10, b + 5]
            };
          }
        } else if (type === 'mult') {
          let base = (i % 2 === 0) ? 2 : 5;
          let factor = (i % 10) + 1;
          let ans = base * factor;
          q = {
            source: `Bảng nhân ${base} SGK`,
            mathText: `${base} × ${factor} = ?`,
            question: `Tính nhẩm: ${base} × ${factor} bằng bao nhiêu?`,
            answer: ans,
            choices: [ans, ans + base, Math.max(0, ans - base), ans + 1]
          };
        } else if (type === 'div') {
          let base = (i % 2 === 0) ? 2 : 5;
          let factor = (i % 10) + 1;
          let total = base * factor;
          q = {
            source: `Bảng chia ${base} SGK`,
            mathText: `${total} : ${base} = ?`,
            question: `Tính nhẩm: ${total} : ${base} bằng bao nhiêu?`,
            answer: factor,
            choices: [factor, factor + 1, Math.max(1, factor - 1), factor + 2]
          };
        } else if (type === 'geom') {
          let shapes = ["Hình tam giác", "Hình tứ giác", "Khối trụ", "Khối cầu", "Khối lập phương", "Khối hộp chữ nhật"];
          let picked = shapes[i % shapes.length];
          let desc = "";
          if (picked === "Hình tam giác") desc = "Hình có 3 đỉnh và 3 cạnh thẳng";
          else if (picked === "Hình tứ giác") desc = "Hình có 4 đỉnh và 4 cạnh thẳng";
          else if (picked === "Khối trụ") desc = "Vật có 2 mặt đáy tròn và thân uốn cong (như lon nước, khúc gỗ tròn)";
          else if (picked === "Khối cầu") desc = "Vật tròn đều về mọi phía, có thể lăn theo mọi hướng (như quả bóng bàn, bi ve)";
          else if (picked === "Khối lập phương") desc = "Khối có 6 mặt đều là hình vuông bằng nhau";
          else desc = "Khối có 6 mặt là hình chữ nhật (như bao diêm, viên gạch)";
          
          q = {
            source: "SGK Hình học & Khối hình",
            visual: `🔍 Đặc điểm: ${desc}`,
            question: "Đặc điểm trên mô tả hình hoặc khối hình nào dưới đây?",
            answer: picked,
            choices: [picked, ...shapes.filter(s => s !== picked).slice(0, 3)]
          };
        } else if (type === 'len_conv') {
          let mVal = 1 + (i % 8);
          let cmVal = (i * 15) % 90 + 10;
          let totalCm = mVal * 100 + cmVal;
          q = {
            source: "SGK Quy đổi độ dài",
            mathText: `${mVal} m + ${cmVal} cm = ? cm`,
            question: `Quy đổi: ${mVal} mét cộng ${cmVal} xăng-ti-mét bằng bao nhiêu xăng-ti-mét?`,
            answer: `${totalCm} cm`,
            choices: [`${totalCm} cm`, `${mVal * 10 + cmVal} cm`, `${totalCm + 10} cm`, `${mVal * 1000 + cmVal} cm`]
          };
        } else if (type === 'mass_conv') {
          let kgVal = 1 + (i % 6);
          let gVal = (i * 50) % 800 + 100;
          let totalG = kgVal * 1000 + gVal;
          q = {
            source: "SGK Quy đổi khối lượng",
            mathText: `${kgVal} kg + ${gVal} g = ? g`,
            question: `Quy đổi: ${kgVal} ki-lô-gam cộng ${gVal} gam bằng bao nhiêu gam?`,
            answer: `${totalG} g`,
            choices: [`${totalG} g`, `${kgVal * 100 + gVal} g`, `${totalG + 100} g`, `${kgVal + gVal} g`]
          };
        } else if (type === 'time_conv') {
          let hVal = 1 + (i % 4);
          let minVal = (i * 5) % 45 + 10;
          let totalMin = hVal * 60 + minVal;
          q = {
            source: "SGK Quy đổi thời gian",
            mathText: `${hVal} giờ + ${minVal} phút = ? phút`,
            question: `Quy đổi: ${hVal} giờ và ${minVal} phút bằng bao nhiêu phút?`,
            answer: `${totalMin} phút`,
            choices: [`${totalMin} phút`, `${hVal * 100 + minVal} phút`, `${totalMin + 10} phút`, `${hVal * 24 + minVal} phút`]
          };
        } else if (type === 'word' || type === 'word_adv') {
          let a = 25 + i * 2;
          let b = 10 + (i * 3) % 15;
          let ans = a + b;
          q = {
            source: "SGK Bài toán lời văn",
            question: `Bạn Nam có ${a} viên bi, bạn Hải có nhiều hơn bạn Nam ${b} viên bi. Hỏi bạn Hải có bao nhiêu viên bi?`,
            answer: `${ans} viên`,
            choices: [`${ans} viên`, `${ans - 5} viên`, `${ans + 5} viên`, `${ans - b} viên`]
          };
        } else if (type === 'polyline') {
          let a = 3 + (i % 4);
          let b = 4 + ((i + 1) % 5);
          let c = 5 + ((i + 2) % 6);
          let sum = a + b + c;
          q = {
            source: "SGK Đường gấp khúc",
            visual: `📏 Đoạn 1 = ${a}cm, Đoạn 2 = ${b}cm, Đoạn 3 = ${c}cm`,
            question: `Tính độ dài đường gấp khúc gồm 3 đoạn thẳng có độ dài ${a}cm, ${b}cm và ${c}cm.`,
            answer: `${sum} cm`,
            choices: [`${sum} cm`, `${sum + 2} cm`, `${sum - 1} cm`, `${sum + 3} cm`]
          };
        } else if (type === 'num1000') {
          let tram = 2 + (i % 8);
          let chuc = (i * 2) % 10;
          let donvi = (i * 3) % 10;
          let num = tram * 100 + chuc * 10 + donvi;
          q = {
            source: "SGK Số phạm vi 1000",
            visual: `🔢 Số gồm ${tram} trăm, ${chuc} chục và ${donvi} đơn vị`,
            question: `Số gồm ${tram} trăm, ${chuc} chục và ${donvi} đơn vị được viết là:`,
            answer: num,
            choices: [num, num + 10, num - 1, num + 100]
          };
        } else if (type === 'money') {
          let ansVal = (i % 2 === 0) ? "2 tờ 500 đồng" : "5 tờ 200 đồng";
          q = {
            source: "SGK Tiền Việt Nam",
            question: `Một tờ tiền 1 000 đồng đổi được bao nhiêu tờ tiền mệnh giá nhỏ hơn?`,
            answer: ansVal,
            choices: [ansVal, "3 tờ 500 đồng", "4 tờ 200 đồng", "1 tờ 500 đồng"]
          };
        } else if (type === 'stats') {
          let red = 5 + (i % 4);
          let blue = 3 + ((i + 1) % 3);
          let total = red + blue;
          q = {
            source: "SGK Thống kê & Khả năng",
            visual: `📊 Có ${red} bông hoa đỏ và ${blue} bông hoa xanh`,
            question: `Có tất cả bao nhiêu bông hoa đỏ và xanh trong lọ?`,
            answer: `${total} bông`,
            choices: [`${total} bông`, `${total + 1} bông`, `${total - 1} bông`, `${total + 2} bông`]
          };
        } else if (type === 'logic_adv') {
          let variant = i % 6;
          if (variant === 0) {
            let num = 10 + (i % 30);
            q = {
              source: `Toán tư duy - Bài toán tính ngược ${i}`,
              visual: `🔮 Bạn Nam nghĩ ra một số: Lấy số đó cộng thêm 15 rồi trừ đi 8 thì được ${num + 7}.`,
              question: `Hỏi ban đầu bạn Nam đã nghĩ ra số nào?`,
              answer: num,
              choices: [num, num + 2, num - 2, num + 5]
            };
          } else if (variant === 1) {
            let trees = 4 + (i % 6);
            let dist = (trees - 1) * 4;
            q = {
              source: `Toán tư duy - Trồng cây khoảng cách ${i}`,
              visual: `🌳 Trồng ${trees} cây thẳng hàng cách đều nhau, khoảng cách giữa 2 cây liền nhau là 4 mét.`,
              question: `Khoảng cách từ cây đầu tiên đến cây cuối cùng là bao nhiêu mét?`,
              answer: `${dist} m`,
              choices: [`${dist} m`, `${trees * 4} m`, `${dist - 4} m`, `${dist + 2} m`]
            };
          } else if (variant === 2) {
            let ageFather = 32 + (i % 8);
            let ageSon = 6 + (i % 4);
            let diff = ageFather - ageSon;
            q = {
              source: `Toán tư duy - Hiệu số tuổi ${i}`,
              visual: `🎂 Hiện nay bố ${ageFather} tuổi, con ${ageSon} tuổi.`,
              question: `Hỏi sau 5 năm nữa, bố hơn con bao nhiêu tuổi?`,
              answer: `${diff} tuổi`,
              choices: [`${diff} tuổi`, `${diff + 5} tuổi`, `${diff - 5} tuổi`, `${diff + 10} tuổi`]
            };
          } else if (variant === 3) {
            let startNum = 2 + (i % 5);
            q = {
              source: `Toán tư duy - Quy luật tăng khoảng cách ${i}`,
              sequence: [startNum, startNum + 2, startNum + 5, startNum + 9, startNum + 14, "?"],
              rule: "Khoảng cách tăng dần: +2, +3, +4, +5, +6",
              answer: startNum + 20,
              choices: [startNum + 20, startNum + 19, startNum + 21, startNum + 18]
            };
          } else if (variant === 4) {
            let candies = 12 + (i % 8) * 2;
            let half = candies / 2;
            q = {
              source: `Toán tư duy - Cho đi nhận lại ${i}`,
              visual: `🍬 An có ${candies} cái kẹo. An cho Bình một số kẹo thì số kẹo của An giảm đi một nửa.`,
              question: `Hỏi An đã cho Bình bao nhiêu cái kẹo?`,
              answer: `${half} cái kẹo`,
              choices: [`${half} cái kẹo`, `${half - 2} cái kẹo`, `${half + 2} cái kẹo`, `${candies} cái kẹo`]
            };
          } else {
            let totalLegs = 10 + (i % 4) * 2;
            let rab = 1 + (i % 2);
            let chicken = (totalLegs - rab * 4) / 2;
            q = {
              source: `Toán tư duy - Đếm chân gà thỏ ${i}`,
              visual: `🐾 Trong sân có ${rab} con thỏ (mỗi con 4 chân) và một số con gà (mỗi con 2 chân). Tổng số chân đếm được là ${totalLegs} chân.`,
              question: `Hỏi trong sân có bao nhiêu con gà?`,
              answer: `${chicken} con gà`,
              choices: [`${chicken} con gà`, `${chicken + 1} con gà`, `${chicken - 1} con gà`, `${chicken + 2} con gà`]
            };
          }
        }
        result.push(q);
      }
      return result;
    }
  </script>
